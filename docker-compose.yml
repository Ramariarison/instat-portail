# Portail INSTAT : passerelle (site + API) et microservices.
#   cp .env.example .env && docker compose up --build
#   → http://localhost:8080 (site) et http://localhost:8080/api/... (API)
name: instat-portail

x-node-service: &node-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-node-env: &node-env
  JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env (voir .env.example)}
  SEED_DEMO: ${SEED_DEMO:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      PUBLICATIONS_DB_PASSWORD: ${PUBLICATIONS_DB_PASSWORD:?}
      CHIFFRES_DB_PASSWORD: ${CHIFFRES_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init-databases.sh:/docker-entrypoint-initdb.d/20-init-databases.sh:ro
    healthcheck:
      # En TCP : pendant l'initialisation, le serveur temporaire n'écoute que sur le socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *node-service
    build:
      context: ./services
      args: { SERVICE: auth }
    environment:
      <<: *node-env
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  publications:
    <<: *node-service
    build:
      context: ./services
      args: { SERVICE: publications }
    environment:
      <<: *node-env
      DATABASE_URL: postgres://publications:${PUBLICATIONS_DB_PASSWORD}@postgres:5432/publications

  chiffres:
    <<: *node-service
    build:
      context: ./services
      args: { SERVICE: chiffres }
    environment:
      <<: *node-env
      DATABASE_URL: postgres://chiffres:${CHIFFRES_DB_PASSWORD}@postgres:5432/chiffres

  files:
    build:
      context: ./services
      args: { SERVICE: files }
    restart: unless-stopped
    environment:
      <<: *node-env
      FILES_DIR: /data/files
      FILES_PUBLIC_PREFIX: /api/files
    volumes:
      - files:/data/files

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${SEED_DEMO:-false}
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      auth: { condition: service_healthy }
      publications: { condition: service_healthy }
      chiffres: { condition: service_healthy }
      files: { condition: service_healthy }

  # Outil de développement, démarré seulement sur demande : docker compose --profile outils up -d
  # → http://localhost:5050 (sans écran de connexion, accessible depuis ce poste uniquement).
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: ["outils"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@instat.mg}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dev-pgadmin}
      # Mode « bureau » : pas de comptes pgAdmin. À ne jamais exposer hors du poste.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./services/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  files:
  pgadmin:
